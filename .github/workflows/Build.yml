name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - "8.0"

permissions:
  contents: write

concurrency:
  group: 8_0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        java: [21]
        os: [ubuntu-slim]
    runs-on: ${{ matrix.os }}
    outputs:
      datetime: ${{ steps.date.outputs.datetime }}
      sha: ${{ steps.commit.outputs.sha }}
      msg: ${{ steps.commit.outputs.msg }}
      jar_name: ${{ steps.jar.outputs.jar_name }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: gradle

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: Find main JAR
        id: jar
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Ошибка: не найден файл"
            exit 1
          fi
          JAR_NAME=$(basename "$JAR_FILE")
          echo "Найден JAR: $JAR_NAME"
          echo "jar_name=$JAR_NAME" >> $GITHUB_OUTPUT
          cp "$JAR_FILE" "$JAR_NAME"

      - name: Get current date and time (Moscow time)
        id: date
        env:
          TZ: Europe/Moscow
        run: echo "datetime=$(date +'%Y%m%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Get last commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: pidge-jar
          path: ${{ steps.jar.outputs.jar_name }}

  release:
    needs: build
    if: github.ref == 'refs/heads/8.0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "8.0"

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: pidge-jar
          path: artifacts

      - name: Delete old release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh release view "8.0" --json id -q ".id" 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            gh release view "8.0" --json assets -q ".assets[].name" | while read -r name; do
              if [[ "$name" == *.jar ]]; then
                gh release delete-asset "8.0" "$name" --yes
              fi
            done
          else
            echo "Релиз 8.0 ещё не создан, пропуск"
          fi

      - name: Move tag to current commit
        run: |
          git tag -f "8.0"
          git push -f origin refs/tags/8.0

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: "8.0"
          commit: "8.0"
          name: "Pidge BTA 8.0-Pre"
          body: |
            **Дата и время сборки:** ${{ needs.build.outputs.datetime }} (МСК)
            **Последний коммит:** [`${{ needs.build.outputs.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Сообщение:** ${{ needs.build.outputs.msg }}
          draft: false
          prerelease: false
          artifacts: "artifacts/*.jar"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
